server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # HTML은 매번 확인해 ?v= 버전이 바뀐 자산을 바로 받게 한다.
  location = /index.html { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 기본 mime.types에 mjs가 없어 ES module이 막히므로 따로 지정한다.
  location ~* \.mjs$ {
    types {}
    default_type application/javascript;
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* \.(js|css|png|mp3)$ {
    add_header Cache-Control "public, max-age=3600";
  }
}
